<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#033649">
  <title>الصفحة غير موجودة — قطر الندى</title>
  <style>
    :root { --bg: #E8DDCB; --ink: #031634; --gold: #CDB380; --green: #036564; }
    @media (prefers-color-scheme: dark) { :root { --bg: #121417; --ink: #EFE6D4; } }
    html, body { height: 100%; margin: 0; }
    body { display: flex; align-items: center; justify-content: center; background: var(--bg); color: var(--ink); font-family: system-ui, "Segoe UI", Tahoma, sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
    main { max-width: 420px; }
    h1 { font-size: 64px; margin: 0; color: var(--gold); }
    p { font-size: 18px; line-height: 1.9; margin: 12px 0 24px; }
    a { display: inline-block; padding: 12px 28px; border-radius: 12px; background: var(--green); color: #fff; text-decoration: none; font-weight: 500; }
  </style>
</head>
<body>
  <main>
    <h1>٤٠٤</h1>
    <p>عذرًا، الصفحة التي تبحث عنها غير موجودة.</p>
    <a href="/">العودة إلى الرئيسية</a>
  </main>
</body>
</html>
