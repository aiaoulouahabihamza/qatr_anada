<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#033649">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="قطر الندى">
  <title>الأذكار — قطر الندى</title>
  <meta name="description" content="فهرس أذكار الصباح والمساء والنوم والاستيقاظ والصلاة من حصن المسلم، مع عدّاد تفاعلي لكل ذكر.">
  <link rel="canonical" href="https://aiaoulouahabihamza.github.io/qatr_anada/adkar/">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-180.png">
  <link rel="stylesheet" href="../var.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../nav.js"></script>
</head>

<body class="aindex">
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <b>الأذكار</b>
        <small>حصن المسلم</small>
      </div>
      <div class="header-btns">
        <button onclick="go('../index.html')" aria-label="الرئيسية">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M5.5 9.7V20h13V9.7L12 4z" /><path d="M3.5 11.2 12 3.8l8.5 7.4M5.5 9.7V20h13V9.7" /><path class="ac" d="M10.2 20v-3.6a1.8 1.8 0 0 1 3.6 0V20" /></svg>
        </button>
        <button onclick="openSettings()" aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><path d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><circle class="ac" cx="12" cy="12" r="3" /></svg>
        </button>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z" /><circle cx="11" cy="11" r="6.5" /><path class="ac" d="M16 16l4.5 4.5" /></svg>
      <input id="q" type="search" placeholder="ابحث في الأذكار والأدعية" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <main class="content">
    <div id="list" aria-live="polite"></div>
    <p id="empty" class="qempty" hidden>لا يوجد ذكر بهذا الاسم</p>
  </main>

  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="sTitle">
      <h3 id="sTitle">الإعدادات</h3>
      <div class="setting">
        <div><b>عدّاد اليوم</b><br><small class="setting-sub">يُصفَّر تلقائيًا كل يوم</small></div>
        <button class="btn" style="padding:8px 16px" onclick="resetToday()">تصفير الآن</button>
      </div>
      <button class="btn" onclick="closeSettings()">تم</button>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="index.js"></script>
</body>

</html>
