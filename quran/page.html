<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#5A091C">
  <title>المصحف — قطر الندى</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../var.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="reader">

  <!-- شريط الأعلى: يظهر ويختفي بالنقر على الصفحة -->
  <header class="rbar">
    <button class="rbtn" onclick="location.href='index.html'" aria-label="فهرس السور">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 5l7 7-7 7" /></svg>
    </button>
    <div class="rtitle">
      <b id="barTitle">المصحف</b>
      <div class="rsub"><span class="rpill" id="barRiwaya"></span><small id="barSub"></small></div>
    </div>
    <button class="rbtn" onclick="openSettings()" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.8">
        <circle cx="12" cy="12" r="3" />
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z" />
      </svg>
    </button>
  </header>

  <!-- الصفحات: تُسحب يمينًا ويسارًا -->
  <main id="pager" class="pager" dir="rtl" aria-label="صفحات المصحف"></main>

  <div id="veil" class="veil"><span></span></div>

  <!-- الإعدادات -->
  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">الإعدادات</h3>
      <div class="setting">
        <div>
          <b>الرواية</b><br>
          <small class="setting-sub">تُفتح السورة الحالية في الرواية الجديدة</small>
        </div>
        <div class="pills">
          <button data-riwaya="hafs" onclick="pickRiwaya('hafs')">حفص</button>
          <button data-riwaya="warsh" onclick="pickRiwaya('warsh')">ورش</button>
          <button data-riwaya="warsh_ma" onclick="pickRiwaya('warsh_ma')">ورش بالرسم المغربي</button>
        </div>
      </div>
      <button class="btn" onclick="closeSettings()">تم</button>
    </div>
  </div>

  <script src="core.js"></script>
  <script>
    function openSettings() { Q.markPills(); document.getElementById("settingsModal").classList.add("show"); }
    function closeSettings() { document.getElementById("settingsModal").classList.remove("show"); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSettings(); });
  </script>
  <script src="page.js"></script>
</body>

</html>
