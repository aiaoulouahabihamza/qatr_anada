<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#033649">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="قطر الندى">
  <title>المصحف — قطر الندى</title>
  <meta name="description" content="اقرأ القرآن الكريم صفحةً صفحة مع التفسير والتلاوة المتزامنة والعلامات المرجعية.">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-180.png">
  <link rel="stylesheet" href="../var.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../nav.js"></script>
</head>

<body class="reader">

  <!-- شريط الأعلى: يظهر ويختفي بالنقر على الصفحة -->
  <header class="rbar">
    <button class="rbtn" onclick="go('index.html')" aria-label="فهرس السور">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 6l6 6-6 6" /></svg>
    </button>
    <div class="rtitle">
      <b id="barTitle">المصحف</b>
      <div class="rsub"><span class="rpill" id="barRiwaya"></span><small id="barSub"></small></div>
    </div>
    <button class="rbtn" onclick="openSettings()" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><path d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><circle class="ac" cx="12" cy="12" r="3" /></svg>
    </button>
  </header>

  <!-- الصفحات: تُسحب يمينًا ويسارًا -->
  <main id="pager" class="pager" dir="rtl" aria-label="صفحات المصحف"></main>

  <div id="veil" class="veil"><span></span></div>

  <!-- علامة مرجعية -->
  <div id="bmSheet" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bmTitle">
      <h3 id="bmTitle">علامة مرجعية جديدة</h3>
      <p id="bmWhere" class="bm-where"></p>
      <label class="bm-lab" for="bmName">اسم العلامة</label>
      <input id="bmName" class="bm-input" type="text" maxlength="40" autocomplete="off">
      <span class="bm-lab">اللون</span>
      <div id="bmColors" class="bm-colors"></div>
      <div class="bm-actions">
        <button class="btn" onclick="saveBm()">حفظ</button>
        <button id="bmDel" class="btn ghost" onclick="delBm()" hidden>حذف</button>
        <button class="btn ghost" onclick="closeBm()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- تفسير الآية -->
  <div id="tfSheet" class="modal tfmodal">
    <div class="modal-content tfbox" role="dialog" aria-modal="true" aria-labelledby="tfWhere">
      <div class="tf-grab"></div>
      <div class="tf-head">
        <div><h3 id="tfWhere">تفسير الآية</h3></div>
        <div class="tf-tools">
          <button onclick="QTafsir.size(-1)" aria-label="تصغير الخط">أ−</button>
          <button onclick="QTafsir.size(1)" aria-label="تكبير الخط">أ+</button>
          <button onclick="QTafsir.close()" aria-label="إغلاق">✕</button>
        </div>
      </div>
      <nav id="tfTabs" class="tf-tabs" aria-label="التفاسير"></nav>
      <div id="tfBody" class="tf-body" aria-live="polite"></div>
      <div class="tf-foot">
        <button id="tfNext" class="btn ghost" onclick="QTafsir.step(1)">الآية التالية</button>
        <button class="btn ghost" onclick="QTafsir.bookmark()">علامة مرجعية</button>
        <button id="tfPrev" class="btn ghost" onclick="QTafsir.step(-1)">الآية السابقة</button>
      </div>
    </div>
  </div>

  <!-- قائمة الآية: تفسير | صوت | علامة -->
  <div id="vsSheet" class="modal vsmodal">
    <div class="modal-content vsbox" role="dialog" aria-modal="true" aria-labelledby="vsWhere">
      <div class="tf-grab"></div>
      <h3 id="vsWhere">الآية</h3>
      <div id="vsPages" class="vs-pages">
        <section class="vs-pg" data-k="tf">
          <div class="vs-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M12 7c-2-1.6-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5.5c-3-.5-6-.1-8 1.5z" /><path d="M12 7c-2-1.6-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5.5c-3-.5-6-.1-8 1.5z" /><path class="ac" d="M12 7v12.5" /></svg></div>
          <b>التفسير</b>
          <p>ثمانية تفاسير لهذه الآية: الميسر، الجلالين، السعدي، ابن كثير وغيرها</p>
          <button class="btn" onclick="vsDo('tf')">اقرأ التفسير</button>
        </section>
        <section class="vs-pg" data-k="au">
          <div class="vs-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M4 10v4h3.5l4.5 3.5v-11L7.5 10z" /><path d="M4 10v4h3.5l4.5 3.5v-11L7.5 10z" /><path class="ac" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a7.5 7.5 0 0 1 0 11" /></svg></div>
          <b>الاستماع</b>
          <div id="vsRecBox" class="rec-box">
            <button id="vsRecBtn" type="button" class="rec-btn" aria-haspopup="listbox" aria-expanded="false" aria-controls="vsRecDrop">
              <span class="rec-btn-info">
                <span id="vsRecName" class="rec-btn-name">جارٍ جلب القرّاء…</span>
                <span id="vsRecSub" class="rec-btn-sub"></span>
              </span>
              <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 9l6 6 6-6" /></svg>
            </button>
            <div id="vsRecDrop" class="rec-drop" hidden>
              <div id="vsRecSearchWrap" class="rec-search-wrap" hidden>
                <input id="vsRecSearch" class="rec-search" type="search" placeholder="ابحث عن قارئ…" autocomplete="off">
              </div>
              <div id="vsRecList" class="rec-list" role="listbox" aria-label="اختيار القارئ"></div>
            </div>
          </div>
          <p id="vsNote" class="vs-note"></p>
          <button id="vsPlay" class="btn" onclick="vsDo('au')">شغّل من هذه الآية</button>
        </section>
        <section class="vs-pg" data-k="bm">
          <div class="vs-ic"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M6.5 3.5h11v17l-5.5-4-5.5 4z" /><path d="M6.5 3.5h11v17l-5.5-4-5.5 4z" /><path class="ac" d="M12 7.5v4M10 9.5h4" /></svg></div>
          <b>العلامة المرجعية</b>
          <p id="vsBmNote">احفظ موضعك في هذه الآية باسم ولون</p>
          <button class="btn" onclick="vsDo('bm')">علامة مرجعية</button>
        </section>
      </div>
      <div id="vsDots" class="vs-dots"><i></i><i></i><i></i></div>
    </div>
  </div>

  <!-- شريط التشغيل -->
  <div id="qaBar" class="qabar" hidden>
    <button id="qaPrev" aria-label="الآية السابقة"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M9 6l6 6-6 6" /></svg></button>
    <button id="qaToggle" class="qa-main" aria-label="تشغيل / إيقاف"></button>
    <button id="qaNext" aria-label="الآية التالية"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M15 6l-6 6 6 6" /></svg></button>
    <div class="qa-info"><b id="qaTitle"></b><small id="qaSub"></small></div>
    <button id="qaStop" aria-label="إيقاف"><svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M6 6l12 12M18 6L6 18" /></svg></button>
  </div>

  <!-- الإعدادات -->
  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">الإعدادات</h3>
      <div class="setting">
        <div>
          <b>الرواية</b><br>
          <small class="setting-sub">تُفتح السورة الحالية في الرواية الجديدة</small>
        </div>
        <div class="pills">
          <button data-riwaya="hafs" onclick="pickRiwaya('hafs')">حفص</button>
          <button data-riwaya="warsh" onclick="pickRiwaya('warsh')">ورش</button>
          <button data-riwaya="warsh_ma" onclick="pickRiwaya('warsh_ma')">ورش بالرسم المغربي</button>
        </div>
      </div>
      <button class="btn" onclick="closeSettings()">تم</button>
    </div>
  </div>

  <script src="core.js"></script>
  <script>
    function openSettings() { Q.markPills(); document.getElementById("settingsModal").classList.add("show"); }
    function closeSettings() { document.getElementById("settingsModal").classList.remove("show"); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSettings(); });
  </script>
  <script src="tafsir.js"></script>
  <script src="audio.js"></script>
  <script src="page.js"></script>
</body>

</html>
