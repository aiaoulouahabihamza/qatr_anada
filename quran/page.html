<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#033649">
  <title>المصحف — قطر الندى</title>
  <link rel="icon" href="../assets/img/logo.png">
  <link rel="stylesheet" href="../var.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
</head>

<body class="reader">

  <!-- شريط الأعلى: يظهر ويختفي بالنقر على الصفحة -->
  <header class="rbar">
    <button class="rbtn" onclick="location.href='index.html'" aria-label="فهرس السور">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2"><path d="M10 6l6 6-6 6" /></svg>
    </button>
    <div class="rtitle">
      <b id="barTitle">المصحف</b>
      <div class="rsub"><span class="rpill" id="barRiwaya"></span><small id="barSub"></small></div>
    </div>
    <button class="rbtn" onclick="openSettings()" aria-label="الإعدادات">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><path d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><circle class="ac" cx="12" cy="12" r="3" /></svg>
    </button>
  </header>

  <!-- الصفحات: تُسحب يمينًا ويسارًا -->
  <main id="pager" class="pager" dir="rtl" aria-label="صفحات المصحف"></main>

  <div id="veil" class="veil"><span></span></div>

  <!-- علامة مرجعية -->
  <div id="bmSheet" class="modal">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="bmTitle">
      <h3 id="bmTitle">علامة مرجعية جديدة</h3>
      <p id="bmWhere" class="bm-where"></p>
      <label class="bm-lab" for="bmName">اسم العلامة</label>
      <input id="bmName" class="bm-input" type="text" maxlength="40" autocomplete="off">
      <span class="bm-lab">اللون</span>
      <div id="bmColors" class="bm-colors"></div>
      <div class="bm-actions">
        <button class="btn" onclick="saveBm()">حفظ</button>
        <button id="bmDel" class="btn ghost" onclick="delBm()" hidden>حذف</button>
        <button class="btn ghost" onclick="closeBm()">إلغاء</button>
      </div>
    </div>
  </div>

  <!-- تفسير الآية -->
  <div id="tfSheet" class="modal tfmodal">
    <div class="modal-content tfbox" role="dialog" aria-modal="true" aria-labelledby="tfWhere">
      <div class="tf-grab"></div>
      <div class="tf-head">
        <div><h3 id="tfWhere">تفسير الآية</h3></div>
        <div class="tf-tools">
          <button onclick="QTafsir.size(-1)" aria-label="تصغير الخط">أ−</button>
          <button onclick="QTafsir.size(1)" aria-label="تكبير الخط">أ+</button>
          <button onclick="QTafsir.close()" aria-label="إغلاق">✕</button>
        </div>
      </div>
      <nav id="tfTabs" class="tf-tabs" aria-label="التفاسير"></nav>
      <div id="tfBody" class="tf-body" aria-live="polite"></div>
      <div class="tf-foot">
        <button id="tfNext" class="btn ghost" onclick="QTafsir.step(1)">الآية التالية</button>
        <button class="btn ghost" onclick="QTafsir.bookmark()">علامة مرجعية</button>
        <button id="tfPrev" class="btn ghost" onclick="QTafsir.step(-1)">الآية السابقة</button>
      </div>
    </div>
  </div>

  <!-- الإعدادات -->
  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">الإعدادات</h3>
      <div class="setting">
        <div>
          <b>الرواية</b><br>
          <small class="setting-sub">تُفتح السورة الحالية في الرواية الجديدة</small>
        </div>
        <div class="pills">
          <button data-riwaya="hafs" onclick="pickRiwaya('hafs')">حفص</button>
          <button data-riwaya="warsh" onclick="pickRiwaya('warsh')">ورش</button>
          <button data-riwaya="warsh_ma" onclick="pickRiwaya('warsh_ma')">ورش بالرسم المغربي</button>
        </div>
      </div>
      <button class="btn" onclick="closeSettings()">تم</button>
    </div>
  </div>

  <script src="core.js"></script>
  <script>
    function openSettings() { Q.markPills(); document.getElementById("settingsModal").classList.add("show"); }
    function closeSettings() { document.getElementById("settingsModal").classList.remove("show"); }
    document.addEventListener("keydown", e => { if (e.key === "Escape") closeSettings(); });
  </script>
  <script src="tafsir.js"></script>
  <script src="page.js"></script>
</body>

</html>
