<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#033649">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="قطر الندى">
  <title>القرآن الكريم — قطر الندى</title>
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" href="../assets/img/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="../assets/img/icon-180.png">
  <link rel="stylesheet" href="../var.css">
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="style.css">
  <script src="../nav.js"></script>
</head>

<body class="qindex">

  <!-- اختيار الرواية: يظهر في أول زيارة ولا يُغلق إلا بالاختيار -->
  <section id="gate" class="gate" hidden aria-labelledby="gateTitle">
    <div class="header">
      <div class="header-top">
        <div class="logo">
          <b>قَطْرُ النَّدَىٰ</b>
          <small>QATR AL NADA</small>
        </div>
      </div>
      <div class="greeting">
        <h1 id="gateTitle">اختر <span>رواية القراءة</span></h1>
        <p>تستطيع تغييرها لاحقًا من الإعدادات</p>
      </div>
    </div>
    <div class="content">
      <button class="rcard" data-pick="warsh">
        <span class="rcard-top"><b>ورش</b><small>عن نافع · رسم المجمع</small></span>
        <span class="rcard-sample" style="font-family:var(--font-warsh)">&#x0627;&#x0650;&#x06ec;&#x0644;&#x0652;&#x062d;&#x064e;&#x0645;&#x0652;&#x062f;&#x064f; &#x0644;&#x0650;&#x0644;&#x0647;&#x0650; &#x0631;&#x064e;&#x0628;&#x0651;&#x0650; &#x0627;&#x0650;&#x06ec;&#x0644;&#x0652;&#x0639;&#x064e;&#x0670;&#x0644;&#x064e;&#x0645;&#x0650;&#x064a;&#x0646;&#x064e;</span>
      </button>
      <button class="rcard" data-pick="hafs">
        <span class="rcard-top"><b>حفص</b><small>عن عاصم</small></span>
        <span class="rcard-sample" style="font-family:var(--font-hafs)">&#x0671;&#x0644;&#x06e1;&#x062d;&#x064e;&#x0645;&#x06e1;&#x062f;&#x064f; &#x0644;&#x0650;&#x0644;&#x0651;&#x064e;&#x0647;&#x0650; &#x0631;&#x064e;&#x0628;&#x0651;&#x0650; &#x0671;&#x0644;&#x06e1;&#x0639;&#x064e;&#x0670;&#x0644;&#x064e;&#x0645;&#x0650;&#x064a;&#x0646;&#x064e;</span>
      </button>
      <button class="rcard" data-pick="warsh_ma">
        <span class="rcard-top"><b>ورش بالرسم المغربي</b><small>المصحف المحمدي</small></span>
        <span class="rcard-sample" style="font-family:var(--font-maghribi)">&#x06f1;&#x0644;&#x0652;&#x062d;&#x064e;&#x0640;&#x0645;&#x0652;&#x062f;&#x064f; &#x0644;&#x0650;&#x0644;&#x0647;&#x0650; &#x0631;&#x064e;&#x0628;&#x0651;&#x0650; &#x06f1;&#x0644;&#x0652;&#x0639;&#x064e;&#x0640;&#x0670;&#x0644;&#x064e;&#x0645;&#x0650;&#x064a;&#x0640;&#x0640;&#x0646;&#x064e;</span>
      </button>
    </div>
  </section>

  <!-- الرأس: نفس رأس الصفحة الرئيسية -->
  <header class="header">
    <div class="header-top">
      <div class="logo">
        <b>القرآن الكريم</b>
        <small id="riwayaName">&nbsp;</small>
      </div>
      <div class="header-btns">
        <button onclick="go('../index.html')" aria-label="الرئيسية">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M5.5 9.7V20h13V9.7L12 4z" /><path d="M3.5 11.2 12 3.8l8.5 7.4M5.5 9.7V20h13V9.7" /><path class="ac" d="M10.2 20v-3.6a1.8 1.8 0 0 1 3.6 0V20" /></svg>
        </button>
        <button onclick="go('bookmarks.html')" aria-label="العلامات المرجعية">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4.2L6 21V4.5a1 1 0 0 1 1-1z" /><path d="M7 3.5h10a1 1 0 0 1 1 1V21l-6-4.2L6 21V4.5a1 1 0 0 1 1-1z" /><path class="ac" d="M9.8 8h4.4" /></svg>
        </button>
        <button onclick="openSettings()" aria-label="الإعدادات">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><path d="M10.37 2.74L13.63 2.74L14.20 5.04L15.37 5.52L17.39 4.30L19.70 6.61L18.48 8.63L18.96 9.80L21.26 10.37L21.26 13.63L18.96 14.20L18.48 15.37L19.70 17.39L17.39 19.70L15.37 18.48L14.20 18.96L13.63 21.26L10.37 21.26L9.80 18.96L8.63 18.48L6.61 19.70L4.30 17.39L5.52 15.37L5.04 14.20L2.74 13.63L2.74 10.37L5.04 9.80L5.52 8.63L4.30 6.61L6.61 4.30L8.63 5.52L9.80 5.04z" /><circle class="ac" cx="12" cy="12" r="3" /></svg>
        </button>
      </div>
    </div>
    <label class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M11 4.5a6.5 6.5 0 1 0 0 13 6.5 6.5 0 0 0 0-13z" /><circle cx="11" cy="11" r="6.5" /><path class="ac" d="M16 16l4.5 4.5" /></svg>
      <input id="q" type="search" placeholder="ابحث عن سورة بالاسم أو الرقم" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <main class="content">

    <!-- آخر قراءة: نفس بطاقة الصفحة الرئيسية -->
    <a id="lastCard" class="card1 qlast" href="page.html" hidden>
      <div class="last-head">
        <small>آخر قراءة</small>
        <span class="badge" id="lastBadge"></span>
      </div>
      <div class="empty-box">
        <div class="icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="1.7"><path class="fl" d="M12 7c-2-1.6-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5.5c-3-.5-6-.1-8 1.5z" /><path d="M12 7c-2-1.6-5-2-8-1.5V18c3-.5 6 0 8 1.5 2-1.5 5-2 8-1.5V5.5c-3-.5-6-.1-8 1.5z" /><path class="ac" d="M12 7v12.5" /></svg>
        </div>
        <b id="lastSurah"></b>
        <p id="lastMeta"></p>
        <span class="btn">تابع القراءة</span>
      </div>
    </a>

    <div id="list" class="qlist" aria-live="polite"></div>
    <p id="empty" class="qempty" hidden>لا توجد سورة بهذا الاسم</p>
  </main>

  <!-- الإعدادات -->
  <div id="settingsModal" class="modal" onclick="if(event.target===this) closeSettings()">
    <div class="modal-content" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <h3 id="settingsTitle">الإعدادات</h3>
      <div class="setting">
        <div>
          <b>الرواية</b><br>
          <small class="setting-sub">اختر رواية القراءة</small>
        </div>
        <div class="pills">
          <button data-riwaya="hafs" onclick="pickRiwaya('hafs')">حفص</button>
          <button data-riwaya="warsh" onclick="pickRiwaya('warsh')">ورش</button>
          <button data-riwaya="warsh_ma" onclick="pickRiwaya('warsh_ma')">ورش بالرسم المغربي</button>
        </div>
      </div>
      <button class="btn" onclick="closeSettings()">تم</button>
    </div>
  </div>

  <script src="core.js"></script>
  <script src="index.js"></script>
</body>

</html>
